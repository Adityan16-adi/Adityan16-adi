
name: Generate contribution snake

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%2300F5D4&color_dots=%23090014,%233C096C,%237B2CBF,%23C77DFF,%2300F5D4
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2300F5D4&color_dots=%23090014,%233C096C,%237B2CBF,%23C77DFF,%2300F5D4
      - name: Publish generated SVGs
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          force_orphan: true
